# Rodada estatistica multispectral dos melhores candidatos por modelo.
#
# Origem: backend/training_jobs_estatistic_analisis.toml
#
# Estrutura:
# - jobs derivados da rodada estatistica anterior;
# - dataset operacional alterado para multispectral em todos os jobs;
# - EfficientNetB7 removido da fila;
# - parametros de treinamento preservados dos jobs originais.
#
# Observacao:
# - os IDs mantem a origem da receita como from_com_fundo ou from_sem_fundo
#   para evitar duplicidade apos trocar ambos os datasets para multispectral.
#
# Execucao:
#   python -m backend.train_pipeline --config backend/training_jobs_multispectral_statistical_analysis.toml

[[jobs]]
id = "mobilenetv3_multispectral_from_com_fundo_best_candidate_seed42"
enabled = true
tags = ["best-candidate", "multispectral", "source-com_fundo", "mobilenet", "macro-f1", "stratified", "weighted", "statistical-repeat", "seed-42", "repeat-01"]
notes = "Treinamento multispectral gerado a partir do job estatistico original mobilenetv3_com_fundo_best_candidate_seed42. Mantem os parametros do job original e altera apenas dataset_name/data_path para data/multispectral."
stat_group = "mobilenetv3_multispectral_from_com_fundo_best_candidate"
stat_repeat = 1
stat_seed = 42
stat_total_repeats = 4
source_job_id = "mobilenetv3_com_fundo_best_candidate"
dataset_name = "multispectral"
data_path = "data/multispectral"
model_name = "MobileNetV3"
experiment_name = "best_candidate_multispectral_from_com_fundo_seed42"
batch_size = 32
num_epochs = 30
learning_rate = 0.00012
fine_tune_learning_rate = 8e-05
early_stopping = true
split_strategy = "stratified"
checkpoint_metric = "val_macro_f1"
sampler_strategy = "weighted"
loss_name = "cross_entropy"
class_weight_strategy = "sqrt_inverse"
label_smoothing = 0
focal_gamma = 1.5
augmentation_profile = "standard"
patience = 7
train_split = 0.8
val_split = 0.1
seed = 42
optimizer_name = "AdamW"
weight_decay = 0.00015
scheduler_factor = 0.5
scheduler_patience = 3
scheduler_min_lr = 1e-06
accumulation_steps = 1
freeze_backbone_epochs = 2

