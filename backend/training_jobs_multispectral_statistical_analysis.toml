notes = "Treinamento multispectral gerado a partir do job estatistico original efficientnetb0_com_fundo_best_candidate_seed9001. Mantem os parametros do job original e altera apenas dataset_name/data_path para data/multispectral."
stat_group = "efficientnetb0_multispectral_from_com_fundo_best_candidate"
stat_repeat = 4
stat_seed = 9001
stat_total_repeats = 4
source_job_id = "efficientnetb0_com_fundo_best_candidate"
dataset_name = "multispectral"
data_path = "data/multispectral"
model_name = "EfficientNetB0"
experiment_name = "best_candidate_multispectral_from_com_fundo_seed9001"
batch_size = 16
num_epochs = 30
learning_rate = 0.0001
fine_tune_learning_rate = 8e-05
early_stopping = true
split_strategy = "stratified"
checkpoint_metric = "val_macro_f1"
sampler_strategy = "weighted"
loss_name = "cross_entropy"
class_weight_strategy = "sqrt_inverse"
label_smoothing = 0
focal_gamma = 1.5
augmentation_profile = "standard"
patience = 7
train_split = 0.8
val_split = 0.1
seed = 9001
optimizer_name = "AdamW"
weight_decay = 0.00015
scheduler_factor = 0.5
scheduler_patience = 3
scheduler_min_lr = 1e-06
accumulation_steps = 1
freeze_backbone_epochs = 2

