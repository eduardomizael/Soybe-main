# Rodada estatistica multispectral dos melhores candidatos por modelo.
#
# Origem: backend/training_jobs_estatistic_analisis.toml
#
# Estrutura atual:
# - fila enxuta para continuar a rodada multispectral;
# - mantem apenas jobs unicos baseados na receita from_com_fundo;
# - remove jobs from_sem_fundo porque usam o mesmo data/multispectral e
#   os mesmos hiperparametros, portanto duplicam os treinos;
# - remove jobs que ja constam como success em
#   models/pipeline_runs/pipeline_run_20260614_205401.json;
# - EfficientNetB7 permanece fora da fila.
#
# Execucao:
#   python -m backend.train_pipeline --config backend/training_jobs_multispectral_statistical_analysis.toml

[[jobs]]
id = "efficientnetb0_multispectral_from_com_fundo_best_candidate_seed9001"
