# Jobs explicitos para backend.train_pipeline.
# Rode todos os jobs habilitados:
#   python -m backend.train_pipeline
#
# Exemplos de filtros:
#   python -m backend.train_pipeline --id mobilenetv3_sem_fundo_baseline
#   python -m backend.train_pipeline --dataset sem_fundo --model MobileNetV3
#   python -m backend.train_pipeline --experiment experimental
#   python -m backend.train_pipeline --tag rtx3070-8gb

[[jobs]]
id = "mobilenetv3_sem_fundo_baseline"
enabled = true
tags = ["rtx3070-8gb", "comparacao-principal", "sem_fundo", "baseline", "mobilenet"]
notes = "MobileNetV3 foi mantido como candidato principal por combinar bom macro F1 com menor custo de treinamento. Batch 32 aproveita melhor a RTX 3070 de 8 GB sem pressionar memoria."
dataset_name = "sem_fundo"
data_path = "data/sem_fundo"
model_name = "MobileNetV3"
experiment_name = "baseline"
batch_size = 32
num_epochs = 20
learning_rate = 0.00015
fine_tune_learning_rate = 0.0001
early_stopping = true
split_strategy = "random"
checkpoint_metric = "val_loss"
sampler_strategy = "shuffle"
patience = 5
train_split = 0.8
val_split = 0.1
seed = 42
optimizer_name = "AdamW"
weight_decay = 0.0001
scheduler_factor = 0.5
scheduler_patience = 2
scheduler_min_lr = 0.000001
accumulation_steps = 1
freeze_backbone_epochs = 2


# ---------------------------------------------------------------------------
# Rodada de refinamento R3
#
# Estes jobs testam as melhorias implementadas apos a R2:
# - loss configuravel: cross_entropy ou focal
# - pesos de classe configuraveis: sqrt_inverse, effective_number ou none
# - label smoothing
# - augmentation_profile conservador para preservar sinais de cor
#
# Todos ficam desabilitados por padrao. Para executar:
#
#   .\.venv\Scripts\python.exe -m backend.train_pipeline --include-disabled --tag refinamento-r3
#
# Para uma primeira passada mais barata:
#
#   .\.venv\Scripts\python.exe -m backend.train_pipeline --include-disabled --tag refinamento-r3 --tag mobilenet
# ---------------------------------------------------------------------------

[[jobs]]
id = "mobilenetv3_com_fundo_r3_no_class_weights"
enabled = false
tags = ["rtx3070-8gb", "refinamento-r3", "com_fundo", "mobilenet", "no-sampler", "no-class-weights", "ablacao-loss", "eficiencia"]
notes = "Ablacao direta do melhor resultado da R2. MobileNetV3 sem weighted sampler venceu a rodada anterior; este job remove tambem os pesos de classe da CrossEntropyLoss para medir se a ponderacao na loss ainda esta supercompensando classes raras. Mantem augmentation standard para isolar apenas o efeito de class_weight_strategy = none."
dataset_name = "com_fundo"
data_path = "data/com_fundo"
model_name = "MobileNetV3"
experiment_name = "r3_no_class_weights"
batch_size = 32
num_epochs = 30
learning_rate = 0.00012
fine_tune_learning_rate = 0.00008
early_stopping = true
split_strategy = "stratified"
checkpoint_metric = "val_macro_f1"
sampler_strategy = "shuffle"
loss_name = "cross_entropy"
class_weight_strategy = "none"
label_smoothing = 0.0
focal_gamma = 1.5
augmentation_profile = "standard"
patience = 7
train_split = 0.8
val_split = 0.1
seed = 42
optimizer_name = "AdamW"
weight_decay = 0.00015
scheduler_factor = 0.5
scheduler_patience = 3
scheduler_min_lr = 0.000001
accumulation_steps = 1
freeze_backbone_epochs = 2

