# ---------------------------------------------------------------------------
# Rodada de refinamento R2
#
# Estes jobs ficam desabilitados por padrao para evitar que `python -m
# backend.train_pipeline` reexecute a comparacao principal inteira junto com uma
# rodada longa. Para executar esta rodada:
#
#   .\.venv\Scripts\python.exe -m backend.train_pipeline --include-disabled --tag refinamento-r2
#
# Para rodar apenas um candidato:
#
#   .\.venv\Scripts\python.exe -m backend.train_pipeline --include-disabled --id efficientnetb2_com_fundo_refine_macro_f1_r2
#
# Observacao: o input_size e definido no codigo por arquitetura
# (MobileNetV3=224, EfficientNetB2=260, EfficientNetB3=300). Nao ha override
# de input_size no TOML hoje, entao estes jobs exploram apenas parametros que a
# pipeline ja aplica de fato.
# ---------------------------------------------------------------------------

[[jobs]]
id = "efficientnetb2_com_fundo_refine_macro_f1_r2"
enabled = false
tags = ["rtx3070-8gb", "refinamento-r2", "com_fundo", "candidato-principal", "efficientnet", "efficientnetb2", "macro-f1", "weighted", "stratified", "long-run"]
notes = "Refinamento principal recomendado. EfficientNetB2 experimental foi o melhor equilibrio entre qualidade e custo: ficou muito perto do B3 em macro F1 e teve a maior accuracy geral. Mantem com_fundo porque este dataset venceu sem_fundo na media e nas classes ambiguas. Usa split estratificado, weighted sampler e checkpoint por val_macro_f1 para proteger classes minoritarias como INSETOS, ESVERDEADO e PURPURAS. Aumenta para 30 epocas com early stopping por macro F1 e patience 7, permitindo mais tempo de convergencia sem obrigar o treino a ir ate o fim. Reduz levemente fine_tune_learning_rate para 0.00006 para refinamento mais estavel depois da fase de cabeca."
dataset_name = "com_fundo"
data_path = "data/com_fundo"
model_name = "EfficientNetB2"
experiment_name = "refine_macro_f1_r2"
batch_size = 12
num_epochs = 30
learning_rate = 0.0001
fine_tune_learning_rate = 0.00006
early_stopping = true
split_strategy = "stratified"
checkpoint_metric = "val_macro_f1"
sampler_strategy = "weighted"
patience = 7
train_split = 0.8
val_split = 0.1
seed = 42
optimizer_name = "AdamW"
weight_decay = 0.00015
scheduler_factor = 0.5
scheduler_patience = 3
scheduler_min_lr = 0.000001
accumulation_steps = 1
freeze_backbone_epochs = 2

