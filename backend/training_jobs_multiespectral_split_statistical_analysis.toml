# Rodada estatistica multiespectral com split predefinido.
#
# Origem: backend/training_jobs_estatistic_analisis.toml
#
# Estrutura esperada do dataset:
# - data/multiespectral_split/<classe>/treino
# - data/multiespectral_split/<classe>/val
# - data/multiespectral_split/<classe>/teste
#
# A pipeline tambem aceita o layout alternativo:
# - data/multiespectral_split/train/<classe>
# - data/multiespectral_split/val/<classe>
# - data/multiespectral_split/test/<classe>
#
# Esta bateria usa os candidatos estatisticos com_fundo como receita base,
# remove EfficientNetB7 e troca o dataset/split para predefinido.
#
# Execucao:
#   python -m backend.train_pipeline --config backend/training_jobs_multiespectral_split_statistical_analysis.toml
[[jobs]]
id = "mobilenetv3_multiespectral_split_best_candidate_seed42"
enabled = true
tags = ["best-candidate", "multiespectral_split", "mobilenet", "macro-f1", "predefined", "weighted", "statistical-repeat", "seed-42", "repeat-01"]
notes = "Repeticao estatistica 1/4 do grupo mobilenetv3_multiespectral_split_best_candidate. Modelo: MobileNetV3; dataset: multiespectral_split; seed: 42. Mantem todos os parametros do job base mobilenetv3_multiespectral_split_best_candidate, variando apenas a seed para calcular media, desvio padrao, intervalos de confianca e comparacoes pareadas. Nota do job base: MobileNetV3 com_fundo. Baseado no melhor MobileNetV3 do round_1: experimental com_fundo, macro F1 92.19%, accuracy 96.24%. Mantem a receita experimental e amplia para 30 epocas com early stopping por macro F1."
stat_group = "mobilenetv3_multiespectral_split_best_candidate"
stat_repeat = 1
stat_seed = 42
stat_total_repeats = 4
source_job_id = "mobilenetv3_com_fundo_best_candidate"
dataset_name = "multiespectral_split"
data_path = "data/multiespectral_split"
model_name = "MobileNetV3"
experiment_name = "best_candidate_multiespectral_split_seed42"
batch_size = 32
num_epochs = 30
learning_rate = 0.00012
fine_tune_learning_rate = 8e-05
early_stopping = true
split_strategy = "predefined"
checkpoint_metric = "val_macro_f1"
sampler_strategy = "weighted"
loss_name = "cross_entropy"
class_weight_strategy = "sqrt_inverse"
label_smoothing = 0
focal_gamma = 1.5
augmentation_profile = "standard"
patience = 7
seed = 42
optimizer_name = "AdamW"
weight_decay = 0.00015
scheduler_factor = 0.5
scheduler_patience = 3
scheduler_min_lr = 1e-06
accumulation_steps = 1
freeze_backbone_epochs = 2
