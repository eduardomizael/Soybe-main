# Ablacao fator-a-fator da configuracao experimental da MobileNetV3.
#
# O primeiro job e o controle necessario para calcular os deltas. Os sete jobs
# seguintes alteram exatamente um fator em relacao a esse controle.
#
# Execucao:
#   uv run python -m backend.train_pipeline --config backend/training_jobs_mobilenetv3_com_fundo_ablation.toml
#
# Primeira rodada exploratoria: uma unica seed (42) e o mesmo split deterministico
# em todos os jobs. Fatores promissores devem ser repetidos posteriormente.

[[jobs]]
id = "mobilenetv3_com_fundo_ablation_control_seed42"
enabled = true
tags = ["ablation", "ablation-control", "com_fundo", "mobilenet", "seed-42"]
notes = "Controle limpo da ablacao. Adam, split random, shuffle, sem scheduler, sem freezing, checkpoint por val_loss e 20 epocas."
ablation_role = "control"
ablation_factor = "none"
ablation_level = "baseline"
dataset_name = "com_fundo"
data_path = "data/com_fundo"
model_name = "MobileNetV3"
experiment_name = "ablation_control_seed42"
batch_size = 32
num_epochs = 20
learning_rate = 0.00015
fine_tune_learning_rate = 0.0001
early_stopping = true
split_strategy = "random"
checkpoint_metric = "val_loss"
sampler_strategy = "shuffle"
loss_name = "cross_entropy"
class_weight_strategy = "sqrt_inverse"
label_smoothing = 0.0
focal_gamma = 1.5
augmentation_profile = "standard"
patience = 5
train_split = 0.8
val_split = 0.1
seed = 42
use_seed = true
optimizer_name = "Adam"
weight_decay = 0.0001
scheduler_name = "none"
scheduler_factor = 0.5
scheduler_patience = 2
scheduler_min_lr = 0.000001
accumulation_steps = 1
freeze_backbone_epochs = 0

