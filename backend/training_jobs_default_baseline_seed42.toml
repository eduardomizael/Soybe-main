# Baseline default-ish jobs for model comparison.
#
# Objetivo:
# - criar uma base simples de comparacao contra os treinos refinados;
# - usar parametros proximos dos defaults do TrainingManager;
# - executar todos os modelos disponiveis exceto EfficientNetB7;
# - usar seed 42 para cada dataset.
#
# Execucao:
#   uv run python -m backend.train_pipeline --config backend/training_jobs_default_baseline_seed42.toml
#
# Defaults preservados/explicitados:
# - num_epochs = 20
# - split_strategy = "random"
# - checkpoint_metric = "val_loss"
# - sampler_strategy = "shuffle"
# - loss_name = "cross_entropy"
# - class_weight_strategy = "sqrt_inverse"
# - augmentation_profile = "standard"
# - patience = 5
# - freeze_backbone_epochs = 0

[[jobs]]
id = "mobilenetv3_com_fundo_default_seed42"
enabled = true
tags = ["baseline-default", "seed-42", "com_fundo", "mobilenet"]
notes = "Baseline default-ish para comparacao com treinos refinados. MobileNetV3, dataset com_fundo, seed 42."
dataset_name = "com_fundo"
data_path = "data/com_fundo"
model_name = "MobileNetV3"
experiment_name = "default_seed42"
num_epochs = 20
learning_rate = 0.0001
fine_tune_learning_rate = 0.0001
early_stopping = true
split_strategy = "random"
checkpoint_metric = "val_loss"
sampler_strategy = "shuffle"
loss_name = "cross_entropy"
class_weight_strategy = "sqrt_inverse"
label_smoothing = 0.0
focal_gamma = 1.5
augmentation_profile = "standard"
patience = 5
train_split = 0.8
val_split = 0.1
seed = 42
optimizer_name = "AdamW"
weight_decay = 0.0001
scheduler_factor = 0.5
scheduler_patience = 2
scheduler_min_lr = 0.000001
accumulation_steps = 1
freeze_backbone_epochs = 0

