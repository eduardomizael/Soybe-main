# Rodada estatistica dos melhores candidatos por modelo e dataset.
#
# Origem: backend/training_jobs_all_models_best.toml
#
# Estrutura:
# - 6 modelos disponiveis nos pipelines de treinamento e deteccao;
# - 2 datasets por modelo: com_fundo e sem_fundo;
# - 4 execucoes por combinacao, variando apenas a seed;
# - total esperado: 48 jobs.
#
# Campos auxiliares para relatorio estatistico:
# - stat_group: agrupa as 4 repeticoes equivalentes;
# - stat_repeat: indice da repeticao dentro do grupo;
# - stat_seed: seed usada na repeticao;
# - stat_total_repeats: total planejado de repeticoes por grupo;
# - source_job_id: id do job candidato original.
#
# Analise esperada depois da rodada:
# - media e desvio padrao de accuracy, macro_f1, val_loss, tempo e throughput;
# - intervalos de confianca por grupo;
# - testes pareados quando as mesmas seeds forem comparadas entre modelos/datasets.
#
# Execucao:
#   python -m backend.train_pipeline --config backend/training_jobs_estatistic_analisis.toml

[[jobs]]
id = "mobilenetv3_com_fundo_best_candidate_seed42"
enabled = true
tags = ["best-candidate", "com_fundo", "mobilenet", "macro-f1", "stratified", "weighted", "statistical-repeat", "seed-42", "repeat-01"]
notes = "Repeticao estatistica 1/4 do grupo mobilenetv3_com_fundo_best_candidate. Modelo: MobileNetV3; dataset: com_fundo; seed: 42. Mantem todos os parametros do job base mobilenetv3_com_fundo_best_candidate, variando apenas a seed para calcular media, desvio padrao, intervalos de confianca e comparacoes pareadas. Nota do job base: MobileNetV3 com_fundo. Baseado no melhor MobileNetV3 do round_1: experimental com_fundo, macro F1 92.19%, accuracy 96.24%. Mantem a receita experimental e amplia para 30 epocas com early stopping por macro F1."
stat_group = "mobilenetv3_com_fundo_best_candidate"
stat_repeat = 1
stat_seed = 42
stat_total_repeats = 4
source_job_id = "mobilenetv3_com_fundo_best_candidate"
dataset_name = "com_fundo"
data_path = "data/com_fundo"
model_name = "MobileNetV3"
experiment_name = "best_candidate_com_fundo_seed42"
batch_size = 32
num_epochs = 30
learning_rate = 0.00012
fine_tune_learning_rate = 8e-05
early_stopping = true
split_strategy = "stratified"
checkpoint_metric = "val_macro_f1"
sampler_strategy = "weighted"
loss_name = "cross_entropy"
class_weight_strategy = "sqrt_inverse"
label_smoothing = 0
focal_gamma = 1.5
augmentation_profile = "standard"
patience = 7
train_split = 0.8
val_split = 0.1
seed = 42
optimizer_name = "AdamW"
weight_decay = 0.00015
scheduler_factor = 0.5
scheduler_patience = 3
scheduler_min_lr = 1e-06
accumulation_steps = 1
freeze_backbone_epochs = 2

